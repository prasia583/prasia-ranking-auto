name: Discover Nexon ranking API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/discover_api.py"
      - ".github/workflows/discover.yml"

permissions:
  contents: write

concurrency:
  group: nexon-api-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/discover_api.py
      - name: Bootstrap ranking snapshot
        run: |
          pip install -r requirements.txt
          set -o pipefail
          python tools/collect_rankings.py 2>&1 | tee diagnostics/collector.log
      - name: Save diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/discovery.json diagnostics/collector.log site/snapshots
          git diff --cached --quiet || git commit -m "Record Nexon ranking discovery"
          git push
