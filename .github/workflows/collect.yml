name: Collect Nexon rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/collect_rankings.py"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "40 5 * * *"
      timezone: "Asia/Seoul"
    - cron: "10 6 * * *"
      timezone: "Asia/Seoul"
    - cron: "40 6 * * *"
      timezone: "Asia/Seoul"
    - cron: "10 7 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: nexon-ranking-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check today's snapshot
        id: snapshot
        shell: bash
        run: |
          label="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          date_key="$(TZ=Asia/Seoul date +%Y_%m_%d)"
          ranking_file="site/snapshots/ranking_${date_key}.json"

          if [ -f "$ranking_file" ] &&              jq -e --arg label "$label" '.[] | select(.label == $label)'                site/snapshots/index.json >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Today's complete snapshot already exists: $label"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot collection is required: $label"
          fi

      - uses: actions/setup-python@v5
        if: steps.snapshot.outputs.needed == 'true'
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.snapshot.outputs.needed == 'true'
        run: pip install -r requirements.txt

      - name: Install Chromium
        if: steps.snapshot.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run collector
        id: collector
        if: steps.snapshot.outputs.needed == 'true'
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set -o pipefail
          python tools/collect_rankings.py 2>&1 | tee diagnostics/collector.log

      - name: Save snapshot and diagnostics
        if: steps.snapshot.outputs.needed == 'true' && always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/snapshots diagnostics/collector.log

          if git diff --cached --quiet; then
            echo "No snapshot changes to save."
            exit 0
          fi

          git commit -m "Update automatic ranking snapshot"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
              git fetch origin main
            fi
          done

          echo "Failed to save the snapshot after 3 attempts."
          exit 1

      - name: Report collector failure
        if: steps.snapshot.outputs.needed == 'true' && steps.collector.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
