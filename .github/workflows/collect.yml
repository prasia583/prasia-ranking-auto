name: Collect Nexon rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/collect_rankings.py"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "10 21 * * *"

permissions:
  contents: write

concurrency:
  group: nexon-ranking-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run collector
        id: collector
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set -o pipefail
          python tools/collect_rankings.py 2>&1 | tee diagnostics/collector.log
      - name: Save snapshot and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/snapshots diagnostics/collector.log
          git diff --cached --quiet || git commit -m "Update automatic ranking snapshot"
          git push

      - name: Report collector failure
        if: steps.collector.outcome == 'failure'
        run: exit 1
